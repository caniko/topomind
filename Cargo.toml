[workspace]
resolver = "2"
members = [
  "sidecar/crates/ccir-core",
  "sidecar/crates/bridge-dto",
  "sidecar/crates/geometry-analysis",
  "sidecar/crates/query-engine",
  "sidecar/crates/revision-store",
  "sidecar/crates/context-compiler",
  "sidecar/crates/policy",
  "sidecar/crates/artifact-store",
  "sidecar/crates/ipc-client",
  "sidecar/crates/session-manager",
  "sidecar/crates/mcp-adapter",
  "sidecar/crates/topomind",
  "freecad-extension",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/caniko/topomind"
rust-version = "1.85"

[workspace.metadata.crane]
name = "topomind"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
uuid = { version = "1.17", features = ["v4", "serde"] }
zip = { version = "7.2", default-features = false, features = ["deflate"] }

ccir-core = { path = "sidecar/crates/ccir-core" }
bridge-dto = { path = "sidecar/crates/bridge-dto" }
geometry-analysis = { path = "sidecar/crates/geometry-analysis" }
query-engine = { path = "sidecar/crates/query-engine" }
revision-store = { path = "sidecar/crates/revision-store" }
context-compiler = { path = "sidecar/crates/context-compiler" }
policy = { path = "sidecar/crates/policy" }
artifact-store = { path = "sidecar/crates/artifact-store" }
ipc-client = { path = "sidecar/crates/ipc-client" }
session-manager = { path = "sidecar/crates/session-manager" }
mcp-adapter = { path = "sidecar/crates/mcp-adapter" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
